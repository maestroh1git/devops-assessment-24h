apiVersion: apps/v1
kind: Deployment
metadata:
  name: fincra-app
  namespace: default
  labels:
    app: fincra-app
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fincra-app
  template:
    metadata:
      labels:
        app: fincra-app
        version: v1
    spec:
      containers:
      - name: fincra-app
        image: ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com/fincra-app:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 80
          protocol: TCP
        env:
        - name: FLASK_ENV
          value: "production"
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            memory: "128Mi"
            cpu: "250m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        securityContext:
          runAsNonRoot: false
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
      restartPolicy: Always