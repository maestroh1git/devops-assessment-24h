name: Deploy Fincra Infrastructure and Application

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: fincra-app
  EKS_CLUSTER_NAME: fincra-cluster_v1
  KUBECTL_VERSION: v1.32.0
  KUSTOMIZE_VERSION: v5.2.1

jobs:
  # Job 1: Lint and Test Application Code
  lint-and-test:
    name: Lint and Test Application
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest

      - name: Lint Python code with flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 app.py --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 app.py --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Test Flask application imports
        run: |
          python -c "from app import app; print('Flask app imported successfully')"
          python -c "from app import app; print(f'Routes: {list(app.url_map.iter_rules())}')"

  # Job 2: Build and Push Docker Image to ECR
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.ref == 'refs/heads/main'
    environment: fincra-deployment
    
    outputs:
      image-tag: ${{ steps.image-info.outputs.image-tag }}
      image-uri: ${{ steps.image-info.outputs.image-uri }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Create ECR repository if it doesn't exist
        run: |
          aws ecr describe-repositories --repository-names ${{ env.ECR_REPOSITORY }} --region ${{ env.AWS_REGION }} || \
          aws ecr create-repository \
            --repository-name ${{ env.ECR_REPOSITORY }} \
            --region ${{ env.AWS_REGION }} \
            --image-scanning-configuration scanOnPush=true \
            --image-tag-mutability MUTABLE

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Building Docker image..."
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          
          echo "Pushing image to ECR..."
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          
          echo "✓ Image pushed successfully!"
          echo "Image URI: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Set image outputs
        id: image-info
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "image-tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "image-uri=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
  
  # Job 3: Deploy Infrastructure with AWS CDK
  deploy-infrastructure:
    name: Deploy AWS Infrastructure
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    environment: fincra-deployment
    
    env:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      AWS_REGION: us-east-1
    
    defaults:
      run:
        working-directory: cdk
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: cdk/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install AWS CDK CLI
        run: npm install -g aws-cdk@latest

      - name: Install CDK dependencies
        run: npm ci

      - name: CDK Bootstrap (if needed)
        run: |
          # Only bootstrap if not already done
          cdk bootstrap aws://${{ secrets.AWS_ACCOUNT_ID }}/${{ env.AWS_REGION }} || echo "Already bootstrapped"

      - name: CDK Synthesize
        run: |
          echo "Synthesizing CDK stacks..."
          cdk synth --all
          echo "✓ CDK synthesis completed successfully!"

      - name: CDK Diff
        run: |
          echo "Checking for infrastructure changes..."
          cdk diff --all || true

      - name: CDK Deploy
        run: |
          echo "Deploying infrastructure stacks..."
          cdk deploy --all --require-approval never --verbose
          echo "✓ Infrastructure deployment completed!"

      - name: Get stack outputs
        run: |
          echo "Fetching stack outputs..."
          aws cloudformation describe-stacks \
            --stack-name FincraEksStack \
            --query 'Stacks[0].Outputs' \
            --region ${{ env.AWS_REGION }} || echo "Stack outputs not yet available"

  # Job 4: Deploy Application to EKS
  deploy-application:
    name: Deploy Application to EKS
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-infrastructure]
    if: github.ref == 'refs/heads/main'
    environment: fincra-deployment
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - name: Install Kustomize
        run: |
          curl -sfLo kustomize.tar.gz https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${{ env.KUSTOMIZE_VERSION }}/kustomize_${{ env.KUSTOMIZE_VERSION }}_linux_amd64.tar.gz
          tar xzf kustomize.tar.gz
          sudo mv kustomize /usr/local/bin/
          kustomize version

      - name: Update kubeconfig
        run: |
          echo "Configuring kubectl for EKS cluster..."
          aws eks update-kubeconfig \
            --name ${{ env.EKS_CLUSTER_NAME }} \
            --region ${{ env.AWS_REGION }}
          
          echo "✓ Kubeconfig updated successfully!"

      - name: Verify cluster access
        run: |
          echo "Verifying cluster connectivity..."
          kubectl cluster-info
          kubectl get nodes || echo "No nodes yet (Fargate will create them on demand)"

      - name: Update image reference in manifests
        env:
          IMAGE_URI: ${{ needs.build-and-push.outputs.image-uri }}
        run: |
          echo "Updating image reference to: $IMAGE_URI"
          cd k8s
          
          # Update deployment.yaml with actual image URI
          sed -i "s|ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com/fincra-app:latest|$IMAGE_URI|g" deployment.yaml
          
          echo "✓ Image reference updated!"

      - name: Deploy to EKS using Kustomize
        run: |
          echo "Deploying application to EKS..."
          cd k8s
          
          # Build and apply Kustomize resources
          kustomize build . | kubectl apply -f -
          
          echo "✓ Kubernetes resources applied successfully!"

      - name: Wait for deployment rollout
        run: |
          echo "Waiting for deployment to complete..."
          kubectl rollout status deployment/fincra-app -n default --timeout=5m || echo "Deployment is still in progress..."

      - name: Verify deployment
        run: |
          echo "=== Deployment Status ==="
          kubectl get deployments -n default
          
          echo ""
          echo "=== Pods Status ==="
          kubectl get pods -n default -l app=fincra-app
          
          echo ""
          echo "=== Service Status ==="
          kubectl get svc -n default
          
          echo ""
          echo "=== Ingress Status ==="
          kubectl get ingress -n default

      - name: Get Application Load Balancer URL
        run: |
          echo "Fetching ALB URL (this may take a few minutes to provision)..."
          
          # Wait up to 5 minutes for ALB to be provisioned
          for i in {1..30}; do
            ALB_URL=$(kubectl get ingress fincra-app-ingress -n default -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "")
            
            if [ -n "$ALB_URL" ]; then
              echo "✓ Application Load Balancer provisioned!"
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              echo "🌐 Application URL: http://$ALB_URL"
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              break
            fi
            
            echo "Waiting for ALB to be provisioned... (attempt $i/30)"
            sleep 10
          done
          
          if [ -z "$ALB_URL" ]; then
            echo "⚠️  ALB not yet available. Check ingress status with: kubectl describe ingress fincra-app-ingress -n default"
          fi
  # Job 5: Post-Deployment Validation
  validate-deployment:
    name: Validate Deployment
    runs-on: ubuntu-latest
    needs: deploy-application
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.EKS_CLUSTER_NAME }} \
            --region ${{ env.AWS_REGION }}

      - name: Check pod health
        run: |
          echo "Checking pod health..."
          kubectl get pods -n default -l app=fincra-app
          
          # Check if pods are running
          RUNNING_PODS=$(kubectl get pods -n default -l app=fincra-app --field-selector=status.phase=Running --no-headers 2>/dev/null | wc -l)
          
          if [ "$RUNNING_PODS" -gt 0 ]; then
            echo "✓ $RUNNING_PODS pod(s) are running successfully!"
          else
            echo "⚠️  No running pods found yet. This is normal for new deployments."
            kubectl describe pods -n default -l app=fincra-app
          fi

      - name: Test application endpoint (if available)
        run: |
          ALB_URL=$(kubectl get ingress fincra-app-ingress -n default -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "")
          
          if [ -n "$ALB_URL" ]; then
            echo "Testing application endpoint: http://$ALB_URL"
            
            # Wait a bit for ALB to be fully ready
            sleep 30
            
            # Test health endpoint
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://$ALB_URL/health || echo "000")
            
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "✓ Health check passed! (HTTP $HTTP_STATUS)"
              
              # Test main endpoint
              RESPONSE=$(curl -s http://$ALB_URL/ || echo "Error")
              echo "Application response: $RESPONSE"
              
              if echo "$RESPONSE" | grep -q "Hello, from Fincra!"; then
                echo "✓✓✓ Application is working correctly! ✓✓✓"
              fi
            else
              echo "⚠️  Application not yet responding (HTTP $HTTP_STATUS). It may still be starting up."
            fi
          else
            echo "ℹ️  ALB not yet available for testing. This is normal for new deployments."
          fi

      - name: Deployment summary
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📦 DEPLOYMENT SUMMARY"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✓ Infrastructure deployed via AWS CDK"
          echo "✓ Docker image built and pushed to ECR"
          echo "✓ Application deployed to EKS Fargate"
          echo "✓ Kubernetes resources configured"
          echo ""
          echo "To access your application:"
          echo "  kubectl get ingress fincra-app-ingress -n default"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"